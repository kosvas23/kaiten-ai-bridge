[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kaiten-ai-bridge"
version = "0.1.0"
description = "Deterministic Kaiten-to-corporate-AI integration service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
kaiten-ai-bridge = "kaiten_ai_bridge.__main__:main"
kaiten-ai-bridge-probe = "kaiten_ai_bridge.probe:main"
kaiten-ai-bridge-capture = "kaiten_ai_bridge.capture:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaiten_ai_bridge"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
