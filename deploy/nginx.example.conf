# This file is intended for /etc/nginx/conf.d/kaiten-ai-bridge.conf, where it is
# included inside nginx's `http` context. Replace the hostname and certificate paths.

limit_req_zone $binary_remote_addr zone=kaiten_ai_webhook:10m rate=10r/s;

upstream kaiten_ai_bridge {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bridge.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bridge.example.com;

    ssl_certificate /etc/letsencrypt/live/bridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # A webhook contains trigger identifiers only; card data and files are fetched
    # separately through the authenticated Kaiten API.
    location = /webhooks/kaiten {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        limit_req zone=kaiten_ai_webhook burst=20 nodelay;

        proxy_pass http://kaiten_ai_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_request_buffering on;
    }

    # Do not expose callback or health endpoints through the public virtual host.
    # The corporate AI should call the callback over localhost (or the selected
    # private container network), with its dedicated Bearer token.
    location / {
        return 404;
    }
}
